<body>
  <div id="root"></div>

  <!--
    CACHE-BUSTING SCRIPT — runs before React, plain JS only.
    Purpose: auto-reload when a new service worker takes control, AND clear
    stale caches when we detect a version mismatch. Both mechanisms ensure
    users always get fresh JS assets after a deploy, even if React crashed.
  -->
  <script>
    (function () {
      // 1. Auto-reload when the active service worker is replaced.
      //    This works even if React never mounts (e.g. scheduler crash).
      if ('serviceWorker' in navigator) {
        // Capture whether a SW already controls this page BEFORE listening.
        // On first install there is no controller, so controllerchange fires
        // for the initial claim — we must NOT reload in that case.
        var hadController = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!hadController) return; // first install, not a real update
          var KEY = 'sc_sw_r';
          if (!sessionStorage.getItem(KEY)) {
            sessionStorage.setItem(KEY, '1');
            location.reload();
          } else {
            sessionStorage.removeItem(KEY);
          }
        });
      }

      // 2. Version-based forced cache clear.
      //    Bump V whenever a breaking JS change is deployed.
      var V = '4', K = 'sc_app_v';
      var prev = localStorage.getItem(K);
      if (prev !== V) {
        localStorage.setItem(K, V);
        if (prev !== null) {
          // Previous version existed → clear SW + caches then reload
          try {
            var done = function () { location.reload(); };
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations()
                .then(function (regs) {
                  return Promise.all(regs.map(function (r) { return r.unregister(); }));
                })
                .then(function () {
                  if (!('caches' in window)) return;
                  return caches.keys().then(function (keys) {
                    return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                  });
                })
                .then(done)
                .catch(done);
            } else {
              done();
            }
          } catch (e) { location.reload(); }
        }
      }
    })();
  </script>
